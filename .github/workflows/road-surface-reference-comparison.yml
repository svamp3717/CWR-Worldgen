name: Paved road reference comparison

on:
  push:
    branches:
      - feature/stock-road-surface-layering
    paths:
      - "src/cwr_worldgen/road_surface_comparison.py"
      - "src/cwr_worldgen/playability.py"
      - "tools/compare_paved_road_models.py"
      - "tools/build_paved_flag_probe.py"
      - "tests/test_road_surface_comparison.py"
      - "tests/test_paved_flag_probe.py"
      - "tests/test_stock_vs_relocated_control_fit.py"
      - ".github/workflows/road-surface-reference-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Validate P3D summaries and model difference reports
        run: python -m pytest -q tests/test_road_surface_comparison.py tests/test_paved_flag_probe.py
      - name: Compare original versus relocated stock paved WRP placement
        run: python -m pytest -q -s tests/test_stock_vs_relocated_control_fit.py
      - name: Validate generated road asset production
        run: python -m pytest -q tests/test_custom_road_generation.py
      - name: Detect new failures versus main in broader road regressions
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/worldgen-main" FETCH_HEAD
          (
            cd "$RUNNER_TEMP/worldgen-main"
            PYTHONPATH="$RUNNER_TEMP/worldgen-main/src" python -m pytest -q               tests/test_road_mouth_regression.py               tests/test_final_road_dedup_policy.py               tests/test_modded_road_styles.py               --junitxml="$RUNNER_TEMP/road-main.xml" > "$RUNNER_TEMP/road-main.log" 2>&1 || true
          )
          python -m pytest -q             tests/test_road_mouth_regression.py             tests/test_final_road_dedup_policy.py             tests/test_modded_road_styles.py             --junitxml="$RUNNER_TEMP/road-feature.xml" > "$RUNNER_TEMP/road-feature.log" 2>&1 || true
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          d = Path(os.environ["RUNNER_TEMP"])
          def failing(label):
              root = ET.parse(d / f"road-{label}.xml").getroot()
              return {
                  (t.get("classname", ""), t.get("name", ""))
                  for t in root.iter("testcase")
                  if t.find("failure") is not None or t.find("error") is not None
              }
          baseline = failing("main")
          feature = failing("feature")
          added = sorted(feature - baseline)
          corrected = sorted(baseline - feature)
          print(f"Broader existing road tests: main failures={len(baseline)}, "
                f"feature failures={len(feature)}, added={len(added)}, fixed={len(corrected)}")
          for test in added:
              print(f"NEW FAILURE: {test}")
          for test in corrected:
              print(f"FIXED BASELINE FAILURE: {test}")
          if added:
              raise SystemExit(1)
          PY
