name: Apply Global Country Visual Cleanup

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings
    paths:
      - 'tools/apply_global_country_visual_cleanup.py'
      - '.github/workflows/apply-global-country-visual-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply global country cleanup
        run: python tools/apply_global_country_visual_cleanup.py
      - name: Validate catalogue structure
        run: |
          test ! -e src/cwr_worldgen/house_styles/24_sweden.json
          test "$(find src/cwr_worldgen/house_styles -maxdepth 1 -name '*.json' | wc -l)" -eq 23
          test "$(find src/cwr_worldgen/country_styles -maxdepth 1 -name '*.json' | wc -l)" -eq 249
          ! grep -R --line-number -E 'parent_region_identifier == "sweden"|exposes_24_regions|len\(load_profiles\(\)\) == 24' tests src/cwr_worldgen tools/sync_osm_house_modeler_styles.py
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pytest
      - name: Verify modeler and global country behavior
        run: |
          pytest -q \
            tests/test_global_country_visual_balance.py \
            tests/test_house_style_catalogue.py \
            tests/test_country_utility_materials.py \
            tests/test_sweden_visual_balance.py \
            tests/test_osm_house_modeler_texture_bridge.py \
            tests/test_osm_house_modeler_geometry_fidelity.py \
            tests/test_osm_house_modeler_upgrade.py \
            tests/test_osm_house_modeler_full_style.py \
            tests/test_building_asset_budget_policy.py \
            tests/test_building_progress_policy.py \
            tests/test_foundation_visual_policy.py
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/cwr_worldgen \
            tests \
            tools/populate_country_visual_balance.py \
            tools/sync_osm_house_modeler_styles.py \
            THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Apply global country visual balance and solid doors"
            git push origin HEAD:upgrade/osm-house-modeler-buildings
          fi
