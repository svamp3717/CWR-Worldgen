name: Build and Publish Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be run from the main branch. Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import runpy
          print(runpy.run_path("src/cwr_worldgen/_version.py")["__version__"])
          PY
          )"
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine project version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing CWR Worldgen $VERSION"

      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump src/cwr_worldgen/_version.py before publishing another release." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump src/cwr_worldgen/_version.py before publishing another release." >&2
            exit 1
          fi

  build-windows:
    name: Build Windows executable
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "CWR-Worldgen" `
            --collect-all cwr_worldgen `
            --collect-all dem_stitcher `
            --collect-all rasterio `
            --collect-all pyarrow `
            --collect-all duckdb `
            tools/pyinstaller_gui_entry.py

      - name: Package Windows executable and editable JSON
        shell: pwsh
        run: |
          $bundle = "dist/CWR-Worldgen-Windows-x64"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "dist/CWR-Worldgen.exe" (Join-Path $bundle "CWR-Worldgen.exe")
          python tools/stage_external_json.py (Join-Path $bundle "config")
          foreach ($dir in @("data", "house_styles", "country_styles")) {
            $json = @(Get-ChildItem (Join-Path $bundle "config/$dir") -Filter *.json -File)
            if ($json.Count -eq 0) {
              throw "No editable JSON staged in config/$dir"
            }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "CWR-Worldgen-Windows-x64.zip"
          Get-Item "CWR-Worldgen-Windows-x64.zip" | Format-List Name,Length,LastWriteTime

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: CWR-Worldgen-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux executable
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y tk

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build Linux executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "CWR-Worldgen" \
            --collect-all cwr_worldgen \
            --collect-all dem_stitcher \
            --collect-all rasterio \
            --collect-all pyarrow \
            --collect-all duckdb \
            tools/pyinstaller_gui_entry.py

      - name: Package Linux executable and editable JSON
        run: |
          bundle="dist/CWR-Worldgen-Linux-x64"
          mkdir -p "$bundle"
          cp "dist/CWR-Worldgen" "$bundle/CWR-Worldgen"
          chmod +x "$bundle/CWR-Worldgen"
          python tools/stage_external_json.py "$bundle/config"
          for dir in data house_styles country_styles; do
            find "$bundle/config/$dir" -maxdepth 1 -name '*.json' -type f | grep -q .
          done
          tar -czf "CWR-Worldgen-Linux-x64.tar.gz" -C dist "CWR-Worldgen-Linux-x64"
          ls -lh "CWR-Worldgen-Linux-x64.tar.gz"

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: CWR-Worldgen-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS Intel application
    needs: prepare-release
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "CWR-Worldgen" \
            --collect-all cwr_worldgen \
            --collect-all dem_stitcher \
            --collect-all rasterio \
            --collect-all pyarrow \
            --collect-all duckdb \
            tools/pyinstaller_gui_entry.py

      - name: Package macOS application and editable JSON
        run: |
          bundle="dist/CWR-Worldgen-macOS-Intel"
          mkdir -p "$bundle"
          cp -R "dist/CWR-Worldgen.app" "$bundle/CWR-Worldgen.app"
          python tools/stage_external_json.py "$bundle/config"
          for dir in data house_styles country_styles; do
            find "$bundle/config/$dir" -maxdepth 1 -name '*.json' -type f | grep -q .
          done
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle" \
            "CWR-Worldgen-macOS-Intel.zip"
          ls -lh "CWR-Worldgen-macOS-Intel.zip"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: CWR-Worldgen-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/CWR-Worldgen-Windows-x64.zip"
          test -f "release-assets/CWR-Worldgen-Linux-x64.tar.gz"
          test -f "release-assets/CWR-Worldgen-macOS-Intel.zip"
          ls -lh release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "release-assets/CWR-Worldgen-Windows-x64.zip" \
            "release-assets/CWR-Worldgen-Linux-x64.tar.gz" \
            "release-assets/CWR-Worldgen-macOS-Intel.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CWR Worldgen $VERSION" \
            --generate-notes \
            --latest
