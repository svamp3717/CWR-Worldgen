name: Temporary terrtest100 bridge regression verification

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest matplotlib zstandard
      - name: Compile bridge alignment
        run: python -m compileall -q src/cwr_worldgen/bridge_final_alignment_policy.py src/cwr_worldgen/bridge_final_alignment_performance_policy.py
      - name: Run bridge alignment tests
        run: python -m pytest -q tests/test_bridge_final_alignment_policy.py tests/test_bridge_final_alignment_performance_policy.py
      - name: Run unified road bridge checks
        run: >-
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_bridge_underlay_cleanup_policy.py::test_unified_bridge_cleanup_removes_generated_road_under_bridge
          tests/test_bridge_underlay_cleanup_policy.py::test_unified_bridge_terminal_masks_use_generated_ribbons
          tests/test_bridge_underlay_spatial_policy.py
