name: Apply Building Resolve Performance Optimization

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings
    paths:
      - tools/apply_building_resolve_performance.py
      - .github/workflows/apply-building-resolve-performance.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply mapped-building resolve optimization
        run: python tools/apply_building_resolve_performance.py

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pytest

      - name: Check generated diff
        run: git diff --check

      - name: Verify building resolve behavior and modeler fidelity
        run: |
          pytest -q \
            tests/test_building_resolve_performance.py \
            tests/test_advisory_object_limits.py \
            tests/test_building_shape_extensions.py \
            tests/test_modeler_opening_dimensions.py \
            tests/test_global_country_visual_balance.py \
            tests/test_country_utility_materials.py \
            tests/test_building_asset_budget_policy.py

      - name: Commit verified optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/cwr_worldgen/osm.py \
            src/cwr_worldgen/osm_house_modeler_runtime.py \
            tests/test_building_resolve_performance.py
          if git diff --cached --quiet; then
            echo "No mapped-building resolve changes to commit"
          else
            git commit -m "Speed up mapped building resolution"
            git push origin HEAD:upgrade/osm-house-modeler-buildings
          fi
