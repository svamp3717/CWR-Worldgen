name: Apply Sweden Visual Balance

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings
    paths:
      - 'tools/apply_sweden_visual_balance.py'
      - 'tools/fix_sweden_visual_balance_tests.py'
      - '.github/workflows/apply-sweden-visual-balance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply visual tuning
        run: |
          python tools/apply_sweden_visual_balance.py
          python tools/fix_sweden_visual_balance_tests.py
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pytest
      - name: Verify Sweden balance, porch suppression, reuse and texture behavior
        run: |
          pytest -q \
            tests/test_sweden_visual_balance.py \
            tests/test_building_asset_budget_policy.py \
            tests/test_osm_house_modeler_geometry_fidelity.py \
            tests/test_osm_house_modeler_texture_bridge.py \
            tests/test_country_utility_materials.py \
            tests/test_foundation_visual_policy.py \
            tests/test_building_progress_policy.py
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Balance Sweden building visuals and disable porches"
            git push origin HEAD:upgrade/osm-house-modeler-buildings
          fi
