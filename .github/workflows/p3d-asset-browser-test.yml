name: P3D asset browser verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest matplotlib
      - run: >
          python -m compileall -q
          tools/p3d_asset_browser_catalog.py
          tools/p3d_asset_browser_app.py
          tools/browse_p3d_assets.pyw
          tests/test_p3d_asset_browser.py
      - run: >
          python -m pytest -q
          tests/test_p3d_asset_browser.py
          tests/test_zstd_wrapped_pbo.py
          tests/test_p3d_texture_sources.py
          tests/test_p3d_texture_render.py
