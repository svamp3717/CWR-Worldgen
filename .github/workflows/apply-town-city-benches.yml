name: Apply town-city-only bench patch

on:
  push:
    branches:
      - fix/soft-road-object-limit

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply tested bench placement patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/bench.patch
          git apply --check /tmp/bench.patch
          git apply /tmp/bench.patch
          rm .github/workflows/apply-town-city-benches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cwr_worldgen/osm.py tests/test_milestone9.py .github/workflows/apply-town-city-benches.yml
          git commit -m "Limit benches to towns and cities"
          git push origin HEAD:fix/soft-road-object-limit
