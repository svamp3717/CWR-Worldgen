name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "CWR-Worldgen" `
            --collect-all cwr_worldgen `
            --collect-all dem_stitcher `
            --collect-all rasterio `
            --collect-all pyarrow `
            --collect-all duckdb `
            tools/pyinstaller_gui_entry.py

      - name: Stage executable and editable JSON
        shell: pwsh
        run: |
          $bundle = "dist/CWR-Worldgen-Windows"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "dist/CWR-Worldgen.exe" (Join-Path $bundle "CWR-Worldgen.exe")
          python tools/stage_external_json.py (Join-Path $bundle "config")

      - name: Verify EXE package was created
        shell: pwsh
        run: |
          $bundle = "dist/CWR-Worldgen-Windows"
          $exe = Join-Path $bundle "CWR-Worldgen.exe"
          if (-not (Test-Path $exe)) {
            throw "$exe was not created"
          }
          foreach ($dir in @("data", "house_styles", "country_styles")) {
            $json = @(Get-ChildItem (Join-Path $bundle "config/$dir") -Filter *.json -File)
            if ($json.Count -eq 0) {
              throw "No editable JSON staged in config/$dir"
            }
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Windows
          path: dist/CWR-Worldgen-Windows/**
          if-no-files-found: error
