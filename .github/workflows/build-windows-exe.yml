name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" "pyinstaller==6.21.0"

      - name: Locate Tcl/Tk data
        shell: pwsh
        run: |
          $paths = python -c "import _tkinter, pathlib, sys; root = pathlib.Path(sys.base_prefix) / 'tcl'; print(root / ('tcl' + _tkinter.TCL_VERSION)); print(root / ('tk' + _tkinter.TK_VERSION))"
          $tclDir = $paths[0].Trim()
          $tkDir = $paths[1].Trim()

          if (-not (Test-Path (Join-Path $tclDir "init.tcl"))) {
            throw "Tcl data directory is missing init.tcl: $tclDir"
          }
          if (-not (Test-Path (Join-Path $tkDir "tk.tcl"))) {
            throw "Tk data directory is missing tk.tcl: $tkDir"
          }

          "TCL_DATA_DIR=$tclDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TK_DATA_DIR=$tkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Tcl data: $tclDir"
          Write-Host "Tk data:  $tkDir"

      - name: Create GUI entry point
        shell: pwsh
        run: |
          @'
          from cwr_worldgen.gui import main

          if __name__ == "__main__":
              main()
          '@ | Set-Content -Encoding utf8 build_gui.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --noupx `
            --optimize 2 `
            --name "CWR-Worldgen" `
            --collect-data cwr_worldgen `
            --add-data "$($env:TCL_DATA_DIR):_tcl_data" `
            --add-data "$($env:TK_DATA_DIR):_tk_data" `
            build_gui.py

      - name: Verify EXE was created
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/CWR-Worldgen.exe")) {
            throw "dist/CWR-Worldgen.exe was not created"
          }
          $exe = Get-Item "dist/CWR-Worldgen.exe"
          $sizeMiB = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built $($exe.Name): $sizeMiB MiB ($($exe.Length) bytes)"

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Windows
          path: dist/CWR-Worldgen.exe
          if-no-files-found: error
