name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Verify splash rendering and PyInstaller configuration
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_pyinstaller_splash.py -v
          if ($LASTEXITCODE -ne 0) { throw "Splash artwork tests failed" }
          python -m unittest discover -s tests -p test_tool_splash_spec.py -v
          if ($LASTEXITCODE -ne 0) { throw "Splash specification tests failed" }

      - name: Generate forest-green Worldgen loading screen
        shell: pwsh
        run: |
          python tools/generate_pyinstaller_splash.py `
            --name "CWR-Worldgen" `
            --output "build/splash/CWR-Worldgen.png"
          if ($LASTEXITCODE -ne 0) { throw "Worldgen splash generation failed" }

      - name: Generate taskbar-visible Worldgen splash specification
        shell: pwsh
        run: |
          pyi-makespec `
            --onefile `
            --windowed `
            --splash "build/splash/CWR-Worldgen.png" `
            --splash-center active `
            --paths tools `
            --paths src `
            --name "CWR-Worldgen" `
            --collect-all cwr_worldgen `
            --collect-all dem_stitcher `
            --collect-all rasterio `
            --collect-all pyarrow `
            --collect-all duckdb `
            tools/pyinstaller_gui_entry.py
          if ($LASTEXITCODE -ne 0) { throw "Worldgen spec generation failed" }
          python tools/configure_tool_splash_spec.py "CWR-Worldgen.spec"
          if ($LASTEXITCODE -ne 0) { throw "Worldgen splash setup failed" }

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            "CWR-Worldgen.spec"
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE build failed" }

      - name: Verify EXE was created
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/CWR-Worldgen.exe")) {
            throw "dist/CWR-Worldgen.exe was not created"
          }
          Get-Item "dist/CWR-Worldgen.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Windows
          path: dist/CWR-Worldgen.exe
          if-no-files-found: error
