name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "CWR-Worldgen" `
            --collect-all cwr_worldgen `
            --collect-all dem_stitcher `
            --collect-all rasterio `
            --collect-all pyarrow `
            --collect-all duckdb `
            tools/pyinstaller_gui_entry.py

      - name: Verify EXE was created
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/CWR-Worldgen.exe")) {
            throw "dist/CWR-Worldgen.exe was not created"
          }
          Get-Item "dist/CWR-Worldgen.exe" | Format-List Name,Length,LastWriteTime

      - name: Smoke-test Windows GUI startup
        shell: pwsh
        run: |
          $env:CWR_WORLDGEN_STARTUP_SMOKE = "1"
          $exe = (Resolve-Path "dist/CWR-Worldgen.exe").Path
          $process = Start-Process -FilePath $exe -Wait -PassThru
          Remove-Item Env:CWR_WORLDGEN_STARTUP_SMOKE -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            $log = "dist/cwr-worldgen-crash.log"
            if (Test-Path $log) {
              Write-Host "---- cwr-worldgen-crash.log ----"
              Get-Content $log
            }
            throw "CWR-Worldgen.exe failed GUI startup smoke test with exit code $($process.ExitCode)"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Windows
          path: dist/CWR-Worldgen.exe
          if-no-files-found: error
