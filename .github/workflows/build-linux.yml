name: Populate Country Utility Materials

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings

permissions:
  contents: write

jobs:
  populate-country-utility-materials:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Populate all country profiles
        run: |
          python tools/populate_country_utility_materials.py
          test "$(git diff --name-only -- src/cwr_worldgen/country_styles '*.json' | wc -l)" -eq 249

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pytest

      - name: Verify country data and material integration
        run: |
          pytest -q \
            tests/test_country_utility_materials.py \
            tests/test_house_style_catalogue.py \
            tests/test_modeler_opening_dimensions.py \
            tests/test_interior_performance_policy.py

      - name: Commit migrated catalogues and restore normal workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/build-linux.yml
          git add src/cwr_worldgen/country_styles .github/workflows/build-linux.yml
          git commit -m "Add utility material pools to all country styles"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
