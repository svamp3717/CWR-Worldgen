name: Build Linux App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y tk

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build Linux executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "CWR-Worldgen" \
            --collect-all cwr_worldgen \
            --collect-all dem_stitcher \
            --collect-all rasterio \
            --collect-all pyarrow \
            --collect-all duckdb \
            tools/pyinstaller_gui_entry.py

      - name: Stage executable and editable JSON
        run: |
          bundle="dist/CWR-Worldgen-Linux-x64"
          mkdir -p "$bundle"
          cp "dist/CWR-Worldgen" "$bundle/CWR-Worldgen"
          chmod +x "$bundle/CWR-Worldgen"
          python tools/stage_external_json.py "$bundle/config"

      - name: Verify package was created
        run: |
          bundle="dist/CWR-Worldgen-Linux-x64"
          test -f "$bundle/CWR-Worldgen"
          for dir in data house_styles country_styles; do
            find "$bundle/config/$dir" -maxdepth 1 -name '*.json' -type f | grep -q .
          done
          ls -lh "$bundle/CWR-Worldgen"
          file "$bundle/CWR-Worldgen"

      - name: Package Linux executable
        run: |
          tar -czf "CWR-Worldgen-Linux-x64.tar.gz" -C dist "CWR-Worldgen-Linux-x64"
          ls -lh "CWR-Worldgen-Linux-x64.tar.gz"

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Linux-x64
          path: CWR-Worldgen-Linux-x64.tar.gz
          if-no-files-found: error
