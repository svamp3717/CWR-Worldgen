name: Build Linux App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y tk

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Verify splash artwork
        run: python -m unittest discover -s tests -p test_pyinstaller_splash.py -v

      - name: Generate forest-green Worldgen loading screen
        run: |
          python tools/generate_pyinstaller_splash.py \
            --name CWR-Worldgen \
            --output build/splash/CWR-Worldgen.png
          test -s build/splash/CWR-Worldgen.png

      - name: Build Linux executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --splash "build/splash/CWR-Worldgen.png" \
            --name "CWR-Worldgen" \
            --collect-all cwr_worldgen \
            --collect-all dem_stitcher \
            --collect-all rasterio \
            --collect-all pyarrow \
            --collect-all duckdb \
            tools/pyinstaller_gui_entry.py

      - name: Verify executable was created
        run: |
          test -f "dist/CWR-Worldgen"
          chmod +x "dist/CWR-Worldgen"
          ls -lh "dist/CWR-Worldgen"
          file "dist/CWR-Worldgen"

      - name: Package Linux executable
        run: |
          tar -czf "CWR-Worldgen-Linux-x64.tar.gz" -C dist "CWR-Worldgen"
          ls -lh "CWR-Worldgen-Linux-x64.tar.gz"

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Linux-x64
          path: CWR-Worldgen-Linux-x64.tar.gz
          if-no-files-found: error
