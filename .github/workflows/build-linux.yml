name: Build Linux App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y tk

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Create GUI entry point
        run: |
          cat > build_gui.py <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import sys

          FROZEN_CLI_MARKER = "--cwr-cli"


          def storage_base_dir() -> Path:
              executable = Path(sys.executable).resolve()
              if sys.platform == "darwin" and executable.parent.name == "MacOS" and executable.parent.parent.name == "Contents":
                  return executable.parents[3]
              return executable.parent


          BASE_DIR = storage_base_dir()
          os.environ.setdefault(
              "CWR_WORLDGEN_GUI_STATE",
              str(BASE_DIR / "config" / "gui-state.json"),
          )


          def install_frozen_dem_cache() -> None:
              """Make dem-stitcher localize remote DEM tiles before merging them."""
              import dem_stitcher

              original_stitch_dem = dem_stitcher.stitch_dem

              def stitch_dem_with_local_cache(*args, **kwargs):
                  if kwargs.get("dst_tile_dir") is None:
                      dem_name = kwargs.get("dem_name")
                      if dem_name is None and len(args) > 1:
                          dem_name = args[1]
                      cache_dir = BASE_DIR / "source-data" / ".dem-stitcher-cache" / str(dem_name or "dem")
                      cache_dir.mkdir(parents=True, exist_ok=True)
                      kwargs["dst_tile_dir"] = cache_dir
                  return original_stitch_dem(*args, **kwargs)

              dem_stitcher.stitch_dem = stitch_dem_with_local_cache


          if FROZEN_CLI_MARKER in sys.argv:
              install_frozen_dem_cache()

          import cwr_worldgen.gui as gui

          # Keep build, source-data, and config beside the distributed application.
          gui.application_base_dir = lambda: BASE_DIR

          if __name__ == "__main__":
              gui.main()
          PY

      - name: Build Linux executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "CWR-Worldgen" \
            --collect-all cwr_worldgen \
            --collect-all dem_stitcher \
            --collect-all rasterio \
            build_gui.py

      - name: Verify executable was created
        run: |
          test -f "dist/CWR-Worldgen"
          chmod +x "dist/CWR-Worldgen"
          ls -lh "dist/CWR-Worldgen"
          file "dist/CWR-Worldgen"

      - name: Package Linux executable
        run: |
          tar -czf "CWR-Worldgen-Linux-x64.tar.gz" -C dist "CWR-Worldgen"
          ls -lh "CWR-Worldgen-Linux-x64.tar.gz"

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Linux-x64
          path: CWR-Worldgen-Linux-x64.tar.gz
          if-no-files-found: error
