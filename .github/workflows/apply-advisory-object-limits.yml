name: Apply advisory object limits

on:
  push:
    branches:
      - fix/soft-road-object-limit

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/soft-road-object-limit
          fetch-depth: 0

      - name: Apply tested patch and remove helper workflow
        shell: bash
        run: |
          cat <<'B64' | base64 -d | gzip -d > /tmp/advisory-object-limits.patch
          
          B64
          git apply --check /tmp/advisory-object-limits.patch
          git apply /tmp/advisory-object-limits.patch
          rm .github/workflows/apply-advisory-object-limits.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make object count limits advisory"
          git push origin HEAD:fix/soft-road-object-limit
