name: Apply Building Asset Budget

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings
    paths:
      - .github/workflows/apply-building-asset-budget.yml
      - tools/patch_building_asset_budget_install.py
      - src/cwr_worldgen/building_asset_budget_policy.py
      - tests/test_building_asset_budget_policy.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install budget policy
        run: python tools/patch_building_asset_budget_install.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pytest

      - name: Test building generation performance policy
        run: |
          pytest -q \
            tests/test_building_asset_budget_policy.py \
            tests/test_interior_performance_policy.py

      - name: Commit policy wiring and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-building-asset-budget.yml
          rm tools/patch_building_asset_budget_install.py
          git add -A
          git commit -m "Reduce procedural building asset generation cost"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
