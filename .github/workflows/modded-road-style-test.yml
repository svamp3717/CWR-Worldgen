name: Modded road style verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: >
          python -m compileall -q
          src/cwr_worldgen/model.py
          src/cwr_worldgen/osm.py
          src/cwr_worldgen/playability.py
          src/cwr_worldgen/generator.py
          src/cwr_worldgen/procedural_infrastructure.py
          src/cwr_worldgen/paved_junction_policy.py
          src/cwr_worldgen/cli.py
          src/cwr_worldgen/gui.py
      - run: >
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_custom_road_generation.py
          tests/test_gui.py
          tests/test_final_building_road_clearance_policy.py
          tests/test_gravel_gap_policy.py
