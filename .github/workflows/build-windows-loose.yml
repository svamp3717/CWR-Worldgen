name: Build Windows Loose Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-loose:
    name: Build Windows loose-file package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build loose-file Windows package
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --contents-directory "." `
            --noupx `
            --windowed `
            --name "CWR-Worldgen" `
            --collect-all cwr_worldgen `
            --collect-all dem_stitcher `
            --collect-all rasterio `
            --collect-all pyarrow `
            --collect-all duckdb `
            tools/pyinstaller_gui_entry.py

      - name: Verify loose-file package
        shell: pwsh
        run: |
          $bundle = "dist/CWR-Worldgen"
          $exe = Join-Path $bundle "CWR-Worldgen.exe"
          if (-not (Test-Path $exe)) {
            throw "$exe was not created"
          }

          $files = @(Get-ChildItem $bundle -Recurse -File)
          if ($files.Count -le 1) {
            throw "Expected a loose-file build, but only $($files.Count) file(s) were produced"
          }

          Write-Host "Loose-file package contains $($files.Count) files."
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-ChildItem $bundle | Sort-Object Name | Select-Object -First 40 Name,Length,Mode

      - name: Smoke-test Windows GUI startup
        shell: pwsh
        run: |
          $env:CWR_WORLDGEN_STARTUP_SMOKE = "1"
          $exe = (Resolve-Path "dist/CWR-Worldgen/CWR-Worldgen.exe").Path
          $process = Start-Process -FilePath $exe -Wait -PassThru
          Remove-Item Env:CWR_WORLDGEN_STARTUP_SMOKE -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            $log = "dist/CWR-Worldgen/cwr-worldgen-crash.log"
            if (Test-Path $log) {
              Write-Host "---- cwr-worldgen-crash.log ----"
              Get-Content $log
            }
            throw "CWR-Worldgen.exe failed GUI startup smoke test with exit code $($process.ExitCode)"
          }

      - name: Upload loose-file ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-Windows-Loose
          path: dist/CWR-Worldgen/**
          if-no-files-found: error
          retention-days: 7
