name: Apply OSM House Modeler texture bridge

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0
      - run: python tools/apply_modeler_texture_generator.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sources]" pytest
      - name: Run texture and building regressions
        run: |
          pytest -q \
            tests/test_osm_house_modeler_texture_bridge.py \
            tests/test_osm_house_modeler_geometry_fidelity.py \
            tests/test_osm_house_modeler_full_style.py \
            tests/test_house_style_catalogue.py \
            tests/test_osm_house_modeler_upgrade.py \
            tests/test_building_shape_extensions.py \
            tests/test_milestone8.py \
            tests/test_milestone9.py::SemanticFeatureTests \
            tests/test_milestone9.py::RoadPieceFittingTests::test_full_build_embeds_reusable_forest_cluster_assets \
            tests/test_milestone9.py::DeploymentTests::test_deploy_runs_even_when_final_validation_report_fails
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-modeler-texture-bridge.yml
          git add -A
          git commit -m "Use OSM House Modeler texture generator for buildings"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
