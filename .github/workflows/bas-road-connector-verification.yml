name: BAS road connector verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest matplotlib
      - run: >
          python -m compileall -q
          src/cwr_worldgen/legacy_proxy_models.py
          src/cwr_worldgen/generator.py
          src/cwr_worldgen/paved_road_generated_fallback_policy.py
          tests/test_modded_road_styles.py
      - run: >
          python -m pytest -q
          tests/test_modded_road_styles.py
