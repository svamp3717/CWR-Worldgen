name: Temporary mod road donor verification
# Temporary branch-only verification; removed after the run.

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest matplotlib
      - name: Compile changed modules
        run: python -m compileall -q src/cwr_worldgen/playability.py src/cwr_worldgen/generator.py src/cwr_worldgen/paved_road_generated_fallback_policy.py src/cwr_worldgen/fast_asset_scan_policy.py src/cwr_worldgen/legacy_proxy_models.py
      - name: Run road regression tests
        run: python -m pytest -q tests/test_modded_road_styles.py tests/test_fast_asset_scan_policy.py tests/test_legacy_proxy_models.py
