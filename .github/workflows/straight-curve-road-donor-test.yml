name: Straight and curve road donor verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest matplotlib
      - run: >
          python -m compileall -q
          src/cwr_worldgen/model.py
          src/cwr_worldgen/source_pipeline.py
          src/cwr_worldgen/milestone6.py
          src/cwr_worldgen/milestone7.py
          src/cwr_worldgen/milestone8.py
          src/cwr_worldgen/milestone9.py
          src/cwr_worldgen/cli.py
          src/cwr_worldgen/gui.py
          src/cwr_worldgen/playability.py
          src/cwr_worldgen/generator.py
          src/cwr_worldgen/legacy_proxy_models.py
          tests/test_modded_road_styles.py
      - run: >
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_custom_road_generation.py
          tests/test_gravel_gap_policy.py
          tests/test_gravel_junction_policy.py
          -k "not policy_is_layered_on_top_of_general_road_quality_policy"
