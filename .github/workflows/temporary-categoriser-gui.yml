name: Temporary categoriser GUI feature validation
on:
  push:
    branches: [feature/p3d-categoriser-gui-browser-controls]
  pull_request:
    branches: [main]
jobs:
  categoriser-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest matplotlib
      - run: >-
          python -m pytest -q
          tests/test_p3d_categoriser_gui_features.py
          tests/test_p3d_categoriser_modern.py
          tests/test_p3d_categoriser_session.py
          tests/test_p3d_categoriser_storage.py
          tests/test_p3d_asset_browser.py
          tests/test_p3d_texture_sources.py
          tests/test_p3d_modern_odol_mesh.py
          tests/test_p3d_modern_paa.py
          tests/test_p3d_preview_performance.py
          tests/test_measure_p3d_models.py
