name: Test stock road policies

on:
  push:
    branches:
      - fix/stock-road-curves

permissions:
  contents: read

jobs:
  stock-road-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run focused road tests
        run: |
          python -m pytest -q \
            tests/test_cwa_rvw4_height_policy.py \
            tests/test_stock_road_curve_policy.py \
            tests/test_stock_road_geometry_policy.py \
            tests/test_stock_road_transform_policy.py \
            tests/test_stock_road_3d_connector_policy.py \
            tests/test_stock_road_junction_policy.py \
            tests/test_stock_road_skew_policy.py \
            tests/test_stock_road_skew_orientation_policy.py \
            tests/test_stock_road_connector_policy.py \
            tests/test_stock_road_surface_overlap_policy.py \
            tests/test_stock_road_relaxation_policy.py \
            tests/test_stock_road_local_fit_policy.py \
            tests/test_stock_road_relaxation_transaction_policy.py \
            tests/test_stock_road_path_conditioning_policy.py \
            tests/test_stock_road_obstacle_policy.py \
            tests/test_stock_road_curve_preservation_policy.py \
            tests/test_stock_road_visual_finish_policy.py \
            tests/test_stock_road_final_continuity_policy.py
      - name: Build targeted in-game road lab
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import math
          import os
          import struct

          from cwr_worldgen.cwa_rvw4_height_policy import CWA_RVW4_HEIGHT_SCALE_METRES
          from cwr_worldgen.milestone9 import Milestone9Spec, build_milestone9
          from cwr_worldgen.osm import BboxProjection
          from cwr_worldgen.source_pipeline import SourceFetchSpec, fetch_sources

          root = Path("ci-ingame")
          source = root / "source"
          bbox = (0.0, 0.0, 0.01, 0.01)
          cells = 64
          cell_size = 50.0
          world_size = cells * cell_size
          projection = BboxProjection.create(bbox, world_size)
          lab_elevation_metres = 96
          player_altitude_metres = lab_elevation_metres + 1

          elevation = source / "elevation" / "raw"
          elevation.mkdir(parents=True, exist_ok=True)
          # Use one flat, high plateau for every case. Keeping all four visual
          # labs in the same first-kilometre region also removes world-edge/grid
          # ambiguity while the generated WRP contract is being verified in CWA.
          values = (lab_elevation_metres,) * 9
          payload = b"".join(value.to_bytes(2, "big", signed=True) for value in values)
          with ZipFile(elevation / "N00E000.hgt.zip", "w") as archive:
              archive.writestr("N00E000.hgt", payload)

          def geometry(points):
              result = []
              for point in points:
                  lat, lon = projection.to_latlon(point)
                  result.append({"lat": lat, "lon": lon})
              return result

          def way(way_id, tags, points):
              return {
                  "type": "way",
                  "id": way_id,
                  "tags": tags,
                  "geometry": geometry(points),
              }

          curve = [(500.0, 300.0), (500.0, 400.0), (500.0, 500.0)]
          for degrees in range(5, 41, 5):
              angle = math.radians(degrees)
              curve.append((
                  500.0 + 100.0 * (1.0 - math.cos(angle)),
                  500.0 + 100.0 * math.sin(angle),
              ))
          end = curve[-1]
          tangent = (math.sin(math.radians(40.0)), math.cos(math.radians(40.0)))
          curve.extend((
              (end[0] + tangent[0] * 100.0, end[1] + tangent[1] * 100.0),
              (end[0] + tangent[0] * 200.0, end[1] + tangent[1] * 200.0),
          ))

          elements = [
              way(100, {"highway": "primary", "surface": "asphalt", "name": "Native Curve Lab"}, curve),
              way(110, {"highway": "primary", "surface": "asphalt", "name": "Skew Main"},
                  ((700.0, 550.0), (850.0, 550.0), (1000.0, 550.0))),
              way(111, {"highway": "primary", "surface": "asphalt", "name": "Skew Branch"},
                  ((850.0, 550.0), (970.0, 670.0))),
              way(120, {"highway": "primary", "surface": "asphalt", "name": "Mixed Main"},
                  ((850.0, 150.0), (850.0, 300.0), (850.0, 450.0))),
              way(121, {"highway": "track", "surface": "gravel", "name": "Mixed Gravel Branch"},
                  ((850.0, 300.0), (680.0, 300.0))),
              way(130, {"highway": "primary", "surface": "asphalt", "name": "Wiggle Lab"},
                  ((350.0, 750.0), (351.0, 800.0), (350.0, 850.0),
                   (349.0, 900.0), (350.0, 950.0))),
              way(140, {"barrier": "hedge"},
                  ((610.0, 470.0), (650.0, 610.0))),
              way(141, {"natural": "tree_row"},
                  ((620.0, 180.0), (620.0, 360.0))),
              {
                  "type": "node",
                  "id": 900,
                  "lat": projection.to_latlon((800.0, 800.0))[0],
                  "lon": projection.to_latlon((800.0, 800.0))[1],
                  "tags": {"place": "village", "name": "Road Lab"},
              },
          ]

          osm = source / "osm"
          osm.mkdir(parents=True, exist_ok=True)
          (osm / "raw-overpass.json").write_text(
              json.dumps({"version": 0.6, "generator": "stock-road-ingame-lab", "elements": elements}),
              encoding="utf-8",
          )
          overture = source / "overture"
          overture.mkdir(parents=True, exist_ok=True)
          (overture / "buildings.geojson").write_text(
              '{"type":"FeatureCollection","features":[]}', encoding="utf-8"
          )
          fetch_sources(SourceFetchSpec(
              source_dir=source,
              bbox=bbox,
              cells=cells,
              cell_size=cell_size,
              dem_provider="hgt",
              reference_map=False,
          ))

          result = build_milestone9(
              root / "build",
              Milestone9Spec(
                  source_dir=source,
                  name="wg_roadlab",
                  display_name="WG Stock Road Lab",
                  solver_iterations=4,
                  world_edge_blend_cells=0,
                  max_forest_objects=0,
                  max_buildings=0,
                  road_connection_tolerance=0.35,
                  procedural_gravel_roads=True,
                  ground_texture_profile="generated",
                  surface_overview_size=256,
                  surface_texture_size=64,
                  verify_regeneration=False,
              ),
          )
          road_report = json.loads(result.road_report_path.read_text(encoding="utf-8"))
          assert road_report["failed_connections"] == 0, road_report
          assert road_report["maximum_connection_gap"] <= 0.35, road_report
          assert road_report["maximum_model_overlap_metres"] <= 0.01, road_report
          assert result.pbo_path.is_file()

          # Audit the serialized WRP, not just the pre-serialization selector.
          wrp_path = root / "build" / "source" / "wg_roadlab" / "wg_roadlab.wrp"
          wrp_bytes = wrp_path.read_bytes()
          header = struct.Struct("<4sii")
          object_record = struct.Struct("<12fi76s")
          magic, width, height = header.unpack_from(wrp_bytes, 0)
          assert magic == b"4WVR"
          raw_heights = struct.unpack_from(f"<{width * height}h", wrp_bytes, header.size)
          expected_raw = round(lab_elevation_metres / CWA_RVW4_HEIGHT_SCALE_METRES)
          assert min(raw_heights) == max(raw_heights) == expected_raw, (
              min(raw_heights), max(raw_heights), expected_raw
          )
          assert abs(expected_raw * CWA_RVW4_HEIGHT_SCALE_METRES - lab_elevation_metres) <= 0.03

          offset = header.size + width * height * 4 + 512 * 32
          curve_headings = []
          native_skew_t = []
          skew_fallback_caps = []
          while offset + object_record.size <= len(wrp_bytes):
              values = object_record.unpack_from(wrp_bytes, offset)
              offset += object_record.size
              model = values[13].split(b"\0", 1)[0]
              if not model:
                  break
              model = model.decode("ascii")
              heading = math.degrees(math.atan2(values[6], values[0])) % 360.0
              x, z = float(values[9]), float(values[11])
              if model == r"o\road\sil10 100.p3d":
                  curve_headings.append(heading)
              elif model == r"o\road\kr_new_sil_sil_t.p3d":
                  native_skew_t.append((heading, x, z))
              elif model == r"o\road\sil6.p3d" and math.hypot(x - 850.0, z - 550.0) <= 1.0:
                  skew_fallback_caps.append((heading, x, z))
              assert model not in {r"o\road\sil10 75.p3d", r"o\road\sil10 50.p3d"}
          assert len(curve_headings) == 4, curve_headings
          assert native_skew_t == [], native_skew_t
          assert len(skew_fallback_caps) == 1, skew_fallback_caps
          for previous, current in zip(curve_headings, curve_headings[1:]):
              delta = (current - previous + 180.0) % 360.0 - 180.0
              assert abs(delta - 10.0) <= 0.05, curve_headings

          skew_heading, skew_x, skew_z = skew_fallback_caps[0]
          axis_error = abs((skew_heading - 90.0 + 90.0) % 180.0 - 90.0)
          assert axis_error <= 0.05, skew_fallback_caps
          assert math.hypot(skew_x - 850.0, skew_z - 550.0) <= 0.05, skew_fallback_caps

          def smoke_mission(title, x, z, heading=0.0):
              return f'''version=11;
          class Mission
          {{
              addOns[]={{"wg_roadlab"}};
              addOnsAuto[]={{"wg_roadlab"}};
              randomSeed=1234;
              class Intel
              {{
                  briefingName="{title}";
                  briefingDescription="WG Stock Road Lab direct-spawn visual and drive test";
                  startWeather=0.200000;
                  forecastWeather=0.200000;
                  year=1985;
                  month=6;
                  day=1;
                  hour=12;
                  minute=0;
              }};
              class Groups
              {{
                  items=1;
                  class Item0
                  {{
                      side="WEST";
                      class Vehicles
                      {{
                          items=1;
                          class Item0
                          {{
                              position[]={{{x:.3f},{player_altitude_metres:.3f},{z:.3f}}};
                              azimut={heading:.6f};
                              id=0;
                              side="WEST";
                              vehicle="SoldierWB";
                              player="PLAYER COMMANDER";
                              leader=1;
                              skill=0.600000;
                          }};
                      }};
                  }};
              }};
          }};
          class Intro {{ randomSeed=1; class Intel {{}}; }};
          class OutroWin {{ randomSeed=2; class Intel {{}}; }};
          class OutroLoose {{ randomSeed=3; class Intel {{}}; }};
          '''

          missions = root / "build" / "Missions"
          targets = (
              ("roadlab_curve.wg_roadlab", "Road Lab - Native Curve", 500.0, 470.0, 0.0),
              ("roadlab_skew_t.wg_roadlab", "Road Lab - 45deg Paved T Fallback", 810.0, 550.0, 90.0),
              ("roadlab_mixed_t.wg_roadlab", "Road Lab - Paved Gravel T", 850.0, 260.0, 0.0),
              ("roadlab_wiggle.wg_roadlab", "Road Lab - Source Wiggle", 350.0, 810.0, 0.0),
          )
          for folder_name, title, x, z, heading in targets:
              folder = missions / folder_name
              folder.mkdir(parents=True, exist_ok=True)
              mission_text = smoke_mission(title, x, z, heading)
              expected_position = (
                  f"position[]={{{x:.3f},{player_altitude_metres:.3f},{z:.3f}}};"
              )
              assert expected_position in mission_text
              (folder / "mission.sqm").write_text(mission_text, encoding="ascii")

          readme = root / "build" / "ROADLAB.txt"
          readme.write_text(
              "WG Stock Road Lab\n"
              f"Commit: {os.environ.get('GITHUB_SHA', 'local')}\n"
              f"Flat lab elevation: {lab_elevation_metres} m\n"
              f"CWA RVW4 height scale: {CWA_RVW4_HEIGHT_SCALE_METRES:.3f} m/unit\n"
              f"Player spawn altitude ASL: {player_altitude_metres} m\n\n"
              "Install @CWR-Milestone9 as a normal CWA/OFP mod folder.\n"
              "Copy the Missions folders into the game's Missions directory if needed.\n\n"
              "Direct-spawn missions:\n"
              "  roadlab_curve.wg_roadlab      - native 100 m stock curve\n"
              "  roadlab_skew_t.wg_roadlab     - 45-degree paved T using small fallback cap\n"
              "  roadlab_mixed_t.wg_roadlab    - paved/gravel T\n"
              "  roadlab_wiggle.wg_roadlab     - source-wiggle straight\n\n"
              "Inspection areas in world X/Z metres:\n"
              "  Native 100 m curve: 500,500\n"
              "  45-degree paved T: 850,550\n"
              "  Paved/gravel T: 850,300\n"
              "  Source-wiggle straight: 350,850\n\n"
              "All four labs now sit inside the same first-kilometre terrain region.\n"
              "Check for grass wedges, road-surface clipping, z-fighting, visible slab seams, "
              "wrong curve handedness, wrong T placement, and gravel showing through the paved main road.\n",
              encoding="utf-8",
          )
          print(f"In-game PBO: {result.pbo_path}")
          print(json.dumps(road_report, indent=2, sort_keys=True))
          PY
      - name: Upload in-game road lab build
        uses: actions/upload-artifact@v4
        with:
          name: wg-roadlab-${{ github.sha }}
          path: ci-ingame/build
          if-no-files-found: error
          retention-days: 14
      - name: Run full test suite
        run: python -m pytest -q
