name: Test stock road policies

on:
  push:
    branches:
      - fix/stock-road-curves
  pull_request:
    paths:
      - "src/cwr_worldgen/*road*.py"
      - "src/cwr_worldgen/gui_entry.py"
      - "src/cwr_worldgen/raceway_policy.py"
      - "tests/test_*road*.py"
      - "tests/test_gravel_*.py"
      - "tests/test_paved_*.py"
      - "tests/test_raceway_policy.py"
      - ".github/workflows/test-stock-roads.yml"

permissions:
  contents: read

jobs:
  stock-road-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run focused road tests
        run: |
          python -m pytest -q \
            tests/test_*road*.py \
            tests/test_gravel_*.py \
            tests/test_paved_*.py \
            tests/test_raceway_policy.py
