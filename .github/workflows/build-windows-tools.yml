name: Build Windows Asset Tools

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-windows-tools.yml"
      - "tools/**"
      - "src/**"
      - "pyproject.toml"
      - "tests/test_p3d_frozen_support.py"

permissions:
  contents: read

jobs:
  build-tools:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Categorise-P3D-Models
            script: tools/categorise_p3d_models.py
            mode: --windowed
          - name: Browse-P3D-Assets
            script: tools/browse_p3d_assets.py
            mode: --windowed
          - name: WRP-Mod-Dependency-Scanner
            script: tools/wrp_mod_dependency_scanner.py
            mode: --console

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" matplotlib pyinstaller

      - name: Verify windowed startup helper
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_p3d_frozen_support.py -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            ${{ matrix.mode }} `
            --paths tools `
            --paths src `
            --collect-all cwr_worldgen `
            --name "${{ matrix.name }}" `
            "${{ matrix.script }}"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }

      - name: Verify executable and CLI help
        shell: pwsh
        run: |
          $exe = "dist/${{ matrix.name }}.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not created" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

          if ("${{ matrix.name }}" -eq "WRP-Mod-Dependency-Scanner") {
            & "./$exe" --help
            if ($LASTEXITCODE -ne 0) { throw "Frozen scanner --help failed" }
          }

      - name: Upload standalone executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-Windows
          path: dist/${{ matrix.name }}.exe
          if-no-files-found: error
          retention-days: 14
