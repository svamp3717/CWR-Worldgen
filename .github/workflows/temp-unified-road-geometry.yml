name: Temporary unified road geometry verification

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest matplotlib zstandard
      - name: Compile unified road modules
        run: python -m compileall -q src/cwr_worldgen/playability.py src/cwr_worldgen/paved_road_generated_fallback_policy.py src/cwr_worldgen/paved_junction_policy.py src/cwr_worldgen/paved_junction_performance_policy.py src/cwr_worldgen/paved_junction_parallel_planning_policy.py src/cwr_worldgen/gravel_junction_policy.py src/cwr_worldgen/gravel_gap_policy.py src/cwr_worldgen/generator.py src/cwr_worldgen/road_chain_parallel_policy.py
      - name: Run unified road tests
        run: python -m pytest -q tests/test_modded_road_styles.py tests/test_gravel_gap_policy.py tests/test_gravel_junction_policy.py tests/test_paved_junction_performance_policy.py tests/test_paved_junction_parallel_planning_policy.py tests/test_road_finish_parallel_policy.py tests/test_final_road_dedup_policy.py
