name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS application
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" "pyinstaller==6.21.0"

      - name: Create GUI entry point
        run: |
          cat > build_gui.py <<'PY'
          from cwr_worldgen.gui import main

          if __name__ == "__main__":
              main()
          PY

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --optimize 2 \
            --name "CWR-Worldgen" \
            --collect-data cwr_worldgen \
            build_gui.py

      - name: Verify app was created
        run: |
          test -d "dist/CWR-Worldgen.app"
          du -sh "dist/CWR-Worldgen.app"

      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/CWR-Worldgen.app" \
            "CWR-Worldgen-macOS-Intel.zip"
          ls -lh "CWR-Worldgen-macOS-Intel.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-macOS-Intel
          path: CWR-Worldgen-macOS-Intel.zip
          if-no-files-found: error
