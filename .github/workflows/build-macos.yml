name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS application
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "CWR-Worldgen" \
            --collect-all cwr_worldgen \
            --collect-all dem_stitcher \
            --collect-all rasterio \
            --collect-all pyarrow \
            --collect-all duckdb \
            tools/pyinstaller_gui_entry.py

      - name: Stage app and editable JSON
        run: |
          bundle="dist/CWR-Worldgen-macOS-Intel"
          mkdir -p "$bundle"
          cp -R "dist/CWR-Worldgen.app" "$bundle/CWR-Worldgen.app"
          python tools/stage_external_json.py "$bundle/config"

      - name: Verify app package was created
        run: |
          bundle="dist/CWR-Worldgen-macOS-Intel"
          test -d "$bundle/CWR-Worldgen.app"
          for dir in data house_styles country_styles; do
            find "$bundle/config/$dir" -maxdepth 1 -name '*.json' -type f | grep -q .
          done
          du -sh "$bundle/CWR-Worldgen.app"

      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/CWR-Worldgen-macOS-Intel" \
            "CWR-Worldgen-macOS-Intel.zip"
          ls -lh "CWR-Worldgen-macOS-Intel.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: CWR-Worldgen-macOS-Intel
          path: CWR-Worldgen-macOS-Intel.zip
          if-no-files-found: error
