name: Validate paved road repair branch

on:
  push:
    branches:
      - feature/paved-road-generated-fallback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sources]" pytest
      - name: Compile package
        run: python -m compileall -q src/cwr_worldgen
      - name: Run focused paved road tests
        run: |
          pytest -q             tests/test_paved_generated_road_fallback.py             tests/test_road_inspector.py             tests/test_final_road_inspector_repair_policy.py             tests/test_final_road_dedup_policy.py             tests/test_bridge_final_alignment_policy.py             tests/test_road_quality_policy.py             tests/test_road_quality_parallel_performance.py
