name: Feature multi-building preset tests

on:
  push:
    branches:
      - feature/multi-building-presets

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run focused tests
        run: |
          python -m pytest -q             tests/test_building_preset_mix.py             tests/test_stock_building_extensions.py             tests/test_stock_building_policy.py             tests/test_milestone9.py
