name: Finish OSM House Modeler fidelity

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings

permissions:
  contents: write

jobs:
  fidelity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0

      - name: Apply final fidelity patch
        run: |
          python tools/fix_fidelity_material_paths.py
          python tools/fix_fidelity_patch_plinth.py
          python tools/finish_osm_house_modeler_fidelity.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sources]" pytest

      - name: Run building fidelity regressions
        run: |
          pytest -q \
            tests/test_osm_house_modeler_geometry_fidelity.py \
            tests/test_osm_house_modeler_full_style.py \
            tests/test_house_style_catalogue.py \
            tests/test_osm_house_modeler_upgrade.py \
            tests/test_building_shape_extensions.py \
            tests/test_milestone8.py \
            tests/test_milestone9.py::SemanticFeatureTests

      - name: Commit completed fidelity layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-osm-house-modeler-fidelity.yml
          git add -A
          git commit -m "Complete OSM House Modeler visual fidelity"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
