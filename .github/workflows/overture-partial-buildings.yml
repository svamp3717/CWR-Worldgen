name: Overture partial-building recovery

on:
  push:
    branches:
      - feature/overture-partial-tile-recovery
    paths:
      - "src/cwr_worldgen/overture.py"
      - "src/cwr_worldgen/overture_geometry_policy.py"
      - "src/cwr_worldgen/source_pipeline.py"
      - "tests/test_overture.py"
      - "tests/test_overture_tiling.py"
      - "tests/test_overture_geometry_policy.py"
      - "tests/test_milestone5.py"
      - ".github/workflows/overture-partial-buildings.yml"
  pull_request:
    paths:
      - "src/cwr_worldgen/overture.py"
      - "src/cwr_worldgen/overture_geometry_policy.py"
      - "src/cwr_worldgen/source_pipeline.py"
      - "tests/test_overture.py"
      - "tests/test_overture_tiling.py"
      - "tests/test_overture_geometry_policy.py"
      - "tests/test_milestone5.py"
      - ".github/workflows/overture-partial-buildings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and source test dependencies
        run: python -m pip install -e ".[sources]" pytest
      - name: Check source pipeline Python syntax
        run: python -m compileall -q src/cwr_worldgen/overture.py src/cwr_worldgen/source_pipeline.py tests/test_overture_tiling.py tests/test_milestone5.py
      - name: Test tiled retrieval, partial manifests, frozen sources and WKB compatibility
        run: |
          python -m pytest -q \
            tests/test_overture.py \
            tests/test_overture_tiling.py \
            tests/test_overture_geometry_policy.py \
            tests/test_milestone5.py
