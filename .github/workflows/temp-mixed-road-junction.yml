name: Temporary mixed road junction regression

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest matplotlib zstandard
      - name: Compile mixed-junction modules
        run: >-
          python -m compileall -q
          src/cwr_worldgen/playability.py
          src/cwr_worldgen/road_chain_parallel_policy.py
          src/cwr_worldgen/paved_junction_policy.py
          src/cwr_worldgen/paved_junction_parallel_planning_policy.py
      - name: Run mixed join regression
        run: >-
          python -m pytest -q -s
          tests/test_modded_road_styles.py::test_mixed_modded_paved_gravel_t_has_no_open_connector_gap
          tests/test_modded_road_styles.py::test_full_pipeline_keeps_mixed_paved_gravel_t_connected
          tests/test_modded_road_styles.py::test_full_pipeline_keeps_two_way_paved_gravel_transition_closed
      - name: Run road donor and junction compatibility
        run: >-
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_synthetic_paved_junctions.py
          tests/test_road_chain_parallel_policy.py
          tests/test_road_finish_parallel_policy.py
          tests/test_gravel_gap_policy.py
          tests/test_paved_junction_performance_policy.py
          tests/test_paved_junction_parallel_planning_policy.py
