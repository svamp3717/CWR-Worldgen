name: Verify Clean Building Performance

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings
    paths:
      - 'src/cwr_worldgen/building_asset_budget_policy.py'
      - 'tests/test_building_asset_budget_policy.py'
      - 'tools/finalize_clean_build_performance.py'
      - '.github/workflows/verify-clean-building-performance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply final performance expectations
        run: python tools/finalize_clean_build_performance.py
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pytest
      - name: Run focused modeler building suite
        run: |
          pytest -q \
            tests/test_building_asset_budget_policy.py \
            tests/test_interior_performance_policy.py \
            tests/test_osm_house_modeler_texture_bridge.py \
            tests/test_osm_house_modeler_geometry_fidelity.py \
            tests/test_foundation_visual_policy.py \
            tests/test_country_utility_materials.py
          pytest -q tests/test_milestone8.py -k \
            'swedish_outbuilding_palette_fits_p3d_texture_path_budget or reuses_quantized_variants_and_honours_variant_cap or building_positions_use_single_modeler_texture_variant_deterministically or high_quality_building_textures_are_opt_in'
      - name: Commit verified performance changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/verify-clean-building-performance.yml
          rm tools/finalize_clean_build_performance.py
          git add -A
          git commit -m "Finalize modeler clean-build performance"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
