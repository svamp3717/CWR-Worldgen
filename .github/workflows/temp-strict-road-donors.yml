name: Temporary strict road donor verification

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest matplotlib zstandard
      - name: Compile donor road modules
        run: >-
          python -m compileall -q
          src/cwr_worldgen/playability.py
          src/cwr_worldgen/road_chain_parallel_policy.py
          src/cwr_worldgen/paved_road_generated_fallback_policy.py
          src/cwr_worldgen/road_quality_policy.py
          src/cwr_worldgen/generator.py
          src/cwr_worldgen/asset_mapping.py
          src/cwr_worldgen/gui.py
      - name: Run donor road tests
        run: >-
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_road_chain_parallel_policy.py
          tests/test_road_finish_parallel_policy.py
      - name: Run bridge alignment tests
        run: >-
          python -m pytest -q
          tests/test_bridge_final_alignment_policy.py
          tests/test_bridge_final_alignment_performance_policy.py
      - name: Run bridge cleanup tests isolated
        run: python -m pytest -q tests/test_bridge_underlay_cleanup_policy.py
      - name: Run bridge spatial tests isolated
        run: python -m pytest -q tests/test_bridge_underlay_spatial_policy.py
      - name: Run cleanup road tests
        run: >-
          python -m pytest -q
          tests/test_gravel_gap_policy.py
          tests/test_final_road_dedup_policy.py
