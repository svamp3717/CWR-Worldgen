name: Road donor CLI verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python -m compileall -q src/cwr_worldgen/cli.py tests/test_modded_road_styles.py
      - run: >
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_custom_road_generation.py
      - run: >
          python -m cwr_worldgen milestone9
          --help
