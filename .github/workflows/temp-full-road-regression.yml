name: Temporary full road regression

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[sources]" pytest matplotlib
      - name: Run full test suite
        run: python -m pytest -q
