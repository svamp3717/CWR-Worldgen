name: Zstd PBO branch verification

on:
  push:
    branches:
      - feature/zstd-wrapped-pbo-support

permissions:
  contents: read

jobs:
  test-zstd-pbo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile Python sources
        run: python -m compileall -q src tools tests/test_zstd_wrapped_pbo.py
      - name: Run wrapped-PBO regression tests
        run: python -m pytest -q tests/test_zstd_wrapped_pbo.py
