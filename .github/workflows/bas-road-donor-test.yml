name: BAS road donor verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest matplotlib
      - run: >
          python -m compileall -q
          src/cwr_worldgen/gui.py
          src/cwr_worldgen/generator.py
          src/cwr_worldgen/playability.py
          tests/test_modded_road_styles.py
          tests/test_gui.py::GuiCommandTests::test_gui_state_restores_road_donors_between_restarts
          tests/test_gui.py::GuiCommandTests::test_road_and_asset_persistence_writes_gui_state
      - run: >
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_gui.py
