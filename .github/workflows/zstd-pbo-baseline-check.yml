name: Zstd PBO baseline check

on:
  push:
    branches:
      - feature/zstd-wrapped-pbo-support

permissions:
  contents: read

jobs:
  baseline-fast-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_fast_asset_scan_policy.py
