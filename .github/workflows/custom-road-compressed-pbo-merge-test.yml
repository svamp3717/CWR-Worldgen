name: Custom roads plus compressed PBO verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest matplotlib
      - run: >
          python -m compileall -q
          src/cwr_worldgen
          tools
          tests/test_modded_road_styles.py
          tests/test_custom_road_generation.py
          tests/test_zstd_wrapped_pbo.py
          tests/test_p3d_texture_sources.py
      - run: >
          python -m pytest -q
          tests/test_modded_road_styles.py
          tests/test_custom_road_generation.py
          tests/test_zstd_wrapped_pbo.py
          tests/test_p3d_texture_sources.py
          tests/test_p3d_texture_render.py
          tests/test_p3d_categoriser_session.py
