name: Temporary categoriser archive and JSON selection validation
on:
  push:
    branches: [feature/p3d-categoriser-gui-browser-controls]
  pull_request:
    branches: [main]
jobs:
  categoriser-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest matplotlib
      - name: Test startup, Save As and existing categoriser regression
        run: >-
          python -m pytest -q
          tests/test_p3d_categoriser_startup.py
          tests/test_p3d_categoriser_gui_features.py
          tests/test_p3d_categoriser_modern.py
          tests/test_p3d_categoriser_session.py
          tests/test_p3d_categoriser_storage.py
          tests/test_p3d_asset_browser.py
          tests/test_p3d_texture_sources.py
          tests/test_measure_p3d_models.py
      - name: Real Tk UI tests via virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          xvfb-run -a python -m pytest -q tests/test_p3d_categoriser_gui_smoke.py
