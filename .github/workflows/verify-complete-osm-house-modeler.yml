name: Verify complete OSM House Modeler branch

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings

permissions:
  contents: write

jobs:
  compare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create isolated branch environment
        run: |
          python -m venv /tmp/branch-venv
          /tmp/branch-venv/bin/python -m pip install --upgrade pip
          /tmp/branch-venv/bin/python -m pip install -e ".[sources]" pytest

      - name: Run complete branch suite
        shell: bash
        run: |
          set +e
          /tmp/branch-venv/bin/pytest -q --junitxml=/tmp/branch.xml
          status=$?
          set -e
          echo "$status" > /tmp/branch.status
          echo "Branch pytest exit: $status"

      - name: Prepare isolated current-main environment
        shell: bash
        run: |
          git fetch origin main
          git worktree add --detach /tmp/cwr-main origin/main
          python -m venv /tmp/main-venv
          /tmp/main-venv/bin/python -m pip install --upgrade pip
          /tmp/main-venv/bin/python -m pip install -e "/tmp/cwr-main[sources]" pytest

      - name: Run complete current-main suite
        shell: bash
        run: |
          set +e
          cd /tmp/cwr-main
          /tmp/main-venv/bin/pytest -q --junitxml=/tmp/main.xml
          status=$?
          set -e
          echo "$status" > /tmp/main.status
          echo "Main pytest exit: $status"

      - name: Compare regression sets
        shell: bash
        run: |
          /tmp/branch-venv/bin/python - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          def failures(path: str) -> set[str]:
              root = ET.parse(path).getroot()
              result = set()
              for case in root.iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  classname = case.attrib.get("classname", "")
                  name = case.attrib.get("name", "")
                  result.add(f"{classname}::{name}" if classname else name)
              return result

          branch = failures("/tmp/branch.xml")
          main = failures("/tmp/main.xml")
          branch_only = sorted(branch - main)
          main_only = sorted(main - branch)
          shared = sorted(branch & main)
          print(f"BRANCH_FAILURES={len(branch)}")
          for item in sorted(branch):
              print(f"BRANCH_FAIL {item}")
          print(f"MAIN_FAILURES={len(main)}")
          for item in sorted(main):
              print(f"MAIN_FAIL {item}")
          print(f"SHARED_FAILURES={len(shared)}")
          for item in shared:
              print(f"SHARED_FAIL {item}")
          print(f"BRANCH_ONLY_FAILURES={len(branch_only)}")
          for item in branch_only:
              print(f"BRANCH_ONLY_FAIL {item}")
          print(f"MAIN_ONLY_FAILURES={len(main_only)}")
          for item in main_only:
              print(f"MAIN_ONLY_FAIL {item}")
          if branch_only:
              sys.exit(1)
          PY

      - name: Remove verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-complete-osm-house-modeler.yml
          git add -A
          git commit -m "Remove final modeler verification workflow"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
