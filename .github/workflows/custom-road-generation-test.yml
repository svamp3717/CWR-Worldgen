name: Custom road generation verification

on:
  push:
    branches:
      - feature/custom-road-generation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python -m compileall -q src tests/test_custom_road_generation.py
      - run: >
          python -m pytest -q
          tests/test_custom_road_generation.py
          tests/test_final_building_road_clearance_policy.py
          tests/test_gravel_gap_policy.py
