name: Apply stock utility pole replacement

on:
  push:
    branches:
      - fix/soft-road-object-limit
    paths:
      - .github/workflows/apply-stock-utility-poles.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soft-road-object-limit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace procedural power utilities with stock models and clear roads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          osm_path = Path('src/cwr_worldgen/osm.py')
          text = osm_path.read_text(encoding='utf-8')

          old_constants = r'''STOCK_SETTLEMENT_UTILITY_POLE_MODELS: tuple[str, ...] = (
              r"data3d\sloupyelA.p3d",
              r"data3d\sloupyell.p3d",
              r"O\Hous\stozarvn_1.p3d",
          )'''
          new_constants = r'''# Original OFP/CWA electrical infrastructure. Mapped OSM power utilities use
          # these stock assets directly; no world-local procedural pole/tower P3Ds are needed.
          STOCK_POWER_POLE_MODELS: tuple[str, ...] = (
              r"data3d\sloupyelA.p3d",
              r"data3d\sloupyell.p3d",
          )
          STOCK_POWER_TOWER_MODELS: tuple[str, ...] = (
              r"O\Hous\stozarvn_1.p3d",
          )
          # Generic settlement roadside poles must stay pole-sized. The large
          # high-voltage mast is reserved for explicit OSM power=tower features.
          STOCK_SETTLEMENT_UTILITY_POLE_MODELS: tuple[str, ...] = STOCK_POWER_POLE_MODELS'''
          if old_constants not in text:
              raise SystemExit('expected stock utility constant block not found')
          text = text.replace(old_constants, new_constants, 1)

          old_settlement = '''                offset = road_width_metres(feature.tags) * 0.5 + 2.0
                          px = x + right_x * offset * side
                          pz = z + right_z * offset * side
                          model = STOCK_SETTLEMENT_UTILITY_POLE_MODELS[
                              stable_roll(identity + ":model", len(STOCK_SETTLEMENT_UTILITY_POLE_MODELS))
                          ]
                          emit_prop(model, px, pz, heading, footprint=0.55, clearance=0.04)'''
          new_settlement = '''                # Keep the full stock pole model, not merely its origin, clear of
                          # the carriageway. These models are visibly wider than a 0.55 m point prop.
                          offset = road_width_metres(feature.tags) * 0.5 + 3.0
                          px = x + right_x * offset * side
                          pz = z + right_z * offset * side
                          model = STOCK_SETTLEMENT_UTILITY_POLE_MODELS[
                              stable_roll(identity + ":model", len(STOCK_SETTLEMENT_UTILITY_POLE_MODELS))
                          ]
                          emit_prop(model, px, pz, heading, footprint=1.5, clearance=0.04)'''
          if old_settlement not in text:
              raise SystemExit('expected settlement pole placement block not found')
          text = text.replace(old_settlement, new_settlement, 1)

          old_utility = '''    utility_sizes = {"power_pole": 1.0, "power_tower": 9.0, "water_tower": 6.5}
              for feature in sorted(dataset.utility_points, key=lambda item: item.osm_key):
                  if utility_objects >= utility_limit:
                      break
                  kind = feature.tags.get("utility", "").casefold()
                  if kind not in utility_sizes:
                      continue
                  x, z = projection.to_world(feature.point)
                  if not (0.0 <= x < spec.world_size and 0.0 <= z < spec.world_size):
                      utility_rejections += 1
                      continue
                  footprint = utility_sizes[kind]
                  if kind == "power_pole" and forest_block_intersects_road_corridors(road_corridors, x, z, block_size=footprint):
                      x, z = nudge_point_away_from_road(
                          dataset, projection, x, z, distance=2.0, world_size=spec.world_size
                      )'''
          new_utility = '''    utility_sizes = {"power_pole": 3.0, "power_tower": 9.0, "water_tower": 6.5}
              for feature in sorted(dataset.utility_points, key=lambda item: item.osm_key):
                  if utility_objects >= utility_limit:
                      break
                  kind = feature.tags.get("utility", "").casefold()
                  if kind not in utility_sizes:
                      continue
                  x, z = projection.to_world(feature.point)
                  if not (0.0 <= x < spec.world_size and 0.0 <= z < spec.world_size):
                      utility_rejections += 1
                      continue
                  footprint = utility_sizes[kind]
                  if kind in {"power_pole", "power_tower"} and forest_block_intersects_road_corridors(
                      road_corridors, x, z, block_size=footprint
                  ):
                      source_x, source_z = x, z
                      # OSM power nodes are frequently snapped to road geometry. Move them
                      # outward until the complete stock model footprint clears the road.
                      for nudge_distance in (3.0, 5.0, 7.0, 9.0, 12.0):
                          candidate_x, candidate_z = nudge_point_away_from_road(
                              dataset, projection, source_x, source_z,
                              distance=nudge_distance, world_size=spec.world_size,
                          )
                          if not forest_block_intersects_road_corridors(
                              road_corridors, candidate_x, candidate_z, block_size=footprint
                          ):
                              x, z = candidate_x, candidate_z
                              break'''
          if old_utility not in text:
              raise SystemExit('expected mapped utility road-nudge block not found')
          text = text.replace(old_utility, new_utility, 1)

          old_model = '''        model = infrastructure_library.utility_model(kind)
                  heading_digest = hashlib.blake2s(f"{seed}:utility:{feature.osm_key}".encode("utf-8"), digest_size=2).digest()
                  heading = float(int.from_bytes(heading_digest, "little") % 360)'''
          new_model = '''        heading_digest = hashlib.blake2s(f"{seed}:utility:{feature.osm_key}".encode("utf-8"), digest_size=2).digest()
                  if kind == "power_pole":
                      model = STOCK_POWER_POLE_MODELS[
                          int.from_bytes(heading_digest, "little") % len(STOCK_POWER_POLE_MODELS)
                      ]
                  elif kind == "power_tower":
                      model = STOCK_POWER_TOWER_MODELS[0]
                  else:
                      # Water towers remain procedural; only electrical poles/towers
                      # are replaced with original game assets.
                      model = infrastructure_library.utility_model(kind)
                  heading = float(int.from_bytes(heading_digest, "little") % 360)'''
          if old_model not in text:
              raise SystemExit('expected procedural utility model block not found')
          text = text.replace(old_model, new_model, 1)
          osm_path.write_text(text, encoding='utf-8')

          mapping_path = Path('src/cwr_worldgen/asset_mapping.py')
          mapping = mapping_path.read_text(encoding='utf-8')
          old_mapping = r'''        rules.append(_rule(
                      "osm-power-utilities", ("utility_points",), {"utility": ("power_pole", "power_tower")},
                      models=(rf"{world_name}\i\util_power_pole.p3d", rf"{world_name}\i\util_power_tower.p3d"),
                      geometry="point", description="Generated power pole/tower models",
                  ))'''
          new_mapping = r'''        rules.append(_rule(
                      "osm-power-utilities", ("utility_points",), {"utility": ("power_pole", "power_tower")},
                      models=(
                          r"data3d\sloupyelA.p3d",
                          r"data3d\sloupyell.p3d",
                          r"O\Hous\stozarvn_1.p3d",
                      ),
                      geometry="point", description="Stock OFP/CWA power pole and high-voltage tower models",
                  ))'''
          if old_mapping not in mapping:
              raise SystemExit('expected generated power utility mapping block not found')
          mapping = mapping.replace(old_mapping, new_mapping, 1)
          mapping_path.write_text(mapping, encoding='utf-8')

          test_path = Path('tests/test_stock_utility_poles.py')
          test_path.write_text(r'''from pathlib import Path
          from types import SimpleNamespace

          from cwr_worldgen.asset_mapping import default_osm_asset_mapping
          from cwr_worldgen.milestone9 import _Milestone9PlayabilitySpec
          from cwr_worldgen.osm import (
              BboxProjection,
              OsmDataset,
              OsmLineFeature,
              OsmPointFeature,
              OsmRaster,
              STOCK_POWER_POLE_MODELS,
              STOCK_POWER_TOWER_MODELS,
              STOCK_SETTLEMENT_UTILITY_POLE_MODELS,
              generate_world_objects,
          )


def _empty_raster(cells: int) -> OsmRaster:
    empty = (False,) * (cells * cells)
    return OsmRaster(cells, empty, empty, empty, empty, empty, empty, cells, 0)


def _spec(bbox, cells):
    return _Milestone9PlayabilitySpec(
        name="stock_utility_test",
        heightmap_path=Path("unused.png"),
        bbox=bbox,
        cells=cells,
        cell_size=25.0,
        max_road_objects=0,
        max_buildings=0,
        max_forest_objects=0,
        maximum_utility_objects=10,
        street_furniture_enabled=False,
        rural_vegetation_enabled=False,
        meadow_grass_enabled=False,
        wetland_reeds_enabled=False,
        barriers_enabled=False,
        bridges_enabled=False,
        forest_undergrowth_enabled=False,
        forest_border_enabled=False,
        rocky_forest_fallback_enabled=False,
        steep_hill_bushes_enabled=False,
        strict_assets=False,
    )


def test_mapped_power_utilities_use_stock_models_only() -> None:
    bbox = (0.0, 0.0, 1.0, 1.0)
    cells = 8
    projection = BboxProjection.create(bbox, cells * 25.0)
    utilities = (
        OsmPointFeature("node/pole", {"utility": "power_pole"}, projection.to_latlon((45.0, 100.0))),
        OsmPointFeature("node/tower", {"utility": "power_tower"}, projection.to_latlon((100.0, 100.0))),
        OsmPointFeature("node/water", {"utility": "water_tower"}, projection.to_latlon((155.0, 100.0))),
    )
    dataset = OsmDataset(
        source_generator="stock-utility-test", element_count=3,
        coastlines=(), water=(), forests=(), farmland=(), urban=(), roads=(),
        utility_points=utilities,
    )
    result = generate_world_objects(
        dataset, projection, _empty_raster(cells), (5.0,) * (cells * cells),
        _spec(bbox, cells), include_roads=False, building_placement_plans=(),
    )
    models = {obj.model_path for obj in result.objects}
    assert models.intersection(STOCK_POWER_POLE_MODELS)
    assert models.intersection(STOCK_POWER_TOWER_MODELS)
    assert not any(model.casefold().endswith(r"\util_power_pole.p3d") for model in models)
    assert not any(model.casefold().endswith(r"\util_power_tower.p3d") for model in models)
    assert any(model.casefold().endswith(r"\util_water_tower.p3d") for model in models)
    assert tuple(STOCK_SETTLEMENT_UTILITY_POLE_MODELS) == tuple(STOCK_POWER_POLE_MODELS)


def test_mapped_power_pole_is_moved_fully_off_residential_road() -> None:
    bbox = (0.0, 0.0, 1.0, 1.0)
    cells = 8
    projection = BboxProjection.create(bbox, cells * 25.0)
    road = OsmLineFeature(
        "way/road", {"highway": "residential"},
        (projection.to_latlon((100.0, 0.0)), projection.to_latlon((100.0, 199.0))),
    )
    pole = OsmPointFeature(
        "node/on-road-pole", {"utility": "power_pole"}, projection.to_latlon((100.0, 75.0))
    )
    dataset = OsmDataset(
        source_generator="stock-pole-road-clearance", element_count=2,
        coastlines=(), water=(), forests=(), farmland=(), urban=(), roads=(road,),
        utility_points=(pole,),
    )
    result = generate_world_objects(
        dataset, projection, _empty_raster(cells), (5.0,) * (cells * cells),
        _spec(bbox, cells), include_roads=False, building_placement_plans=(),
    )
    poles = [obj for obj in result.objects if obj.model_path in STOCK_POWER_POLE_MODELS]
    assert len(poles) == 1
    # Residential roads are 6 m wide here. A 3 m pole footprint needs its
    # centre at least 4.5 m from the road centreline; the 5 m nudge is the first
    # deterministic candidate that fully clears it.
    assert abs(poles[0].x - 100.0) >= 5.0 - 1e-6


def test_default_asset_mapping_requires_stock_power_utility_models() -> None:
    mapping = default_osm_asset_mapping(SimpleNamespace(name="mapping_test"), 9)
    rule = next(rule for rule in mapping.rules if rule.rule_id == "osm-power-utilities")
    assert set(rule.models) == {
        r"data3d\sloupyelA.p3d",
        r"data3d\sloupyell.p3d",
        r"O\Hous\stozarvn_1.p3d",
    }
    assert not any("util_power_" in model.casefold() for model in rule.models)
'''.replace('\n          ', '\n'), encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Commit tested replacement and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-stock-utility-poles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use stock power poles with road-safe placement"
          git push origin HEAD:fix/soft-road-object-limit
