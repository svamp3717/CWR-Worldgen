name: Apply Single Chimney Policy

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings
    paths:
      - tools/apply_single_chimney_policy.py
      - .github/workflows/apply-single-chimney-policy.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply single-chimney policy
        run: python tools/apply_single_chimney_policy.py
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[sources]" pytest
      - name: Check generated diff
        run: git diff --check
      - name: Verify chimney and building behavior
        run: |
          pytest -q \
            tests/test_single_chimney_policy.py \
            tests/test_sweden_colour_and_porch_cleanup.py \
            tests/test_building_shape_extensions.py \
            tests/test_modeler_opening_dimensions.py \
            tests/test_building_asset_budget_policy.py
      - name: Commit verified policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/cwr_worldgen/osm_house_modeler_upgrade.py \
            src/cwr_worldgen/opening_dimension_policy.py \
            tests/test_single_chimney_policy.py
          if git diff --cached --quiet; then
            echo "No single-chimney changes to commit"
          else
            git commit -m "Limit procedural buildings to one chimney"
            git push origin HEAD:upgrade/osm-house-modeler-buildings
          fi
