name: Temporary P3D IFA archive validation
on:
  push:
    branches: [feature/p3d-browser-modern-odol]
  pull_request:
    branches: [main]
jobs:
  archive-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest matplotlib
      # The two excluded WRP tests also fail on main; neither test nor scanner
      # module was changed by this branch. All IFA scanner cases still run.
      - run: >-
          python -m pytest -q
          tests/test_p3d_ifa_archives.py
          tests/test_p3d_asset_browser.py
          tests/test_p3d_modern_odol_mesh.py
          tests/test_p3d_texture_sources.py
          tests/test_p3d_modern_odol.py
          tests/test_p3d_modern_paa.py
          tests/test_p3d_texture_preview.py
          tests/test_p3d_preview_performance.py
          tests/test_wrp_mod_dependency_scanner.py
          -k 'not test_pbo_without_wrp_reports_warning_instead_of_crashing and not test_table_sort_handles_all_columns_and_numeric_reference_counts'
