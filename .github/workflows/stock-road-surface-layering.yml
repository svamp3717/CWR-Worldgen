name: Validate stock road surface layering

on:
  pull_request:
    paths:
      - "src/cwr_worldgen/playability.py"
      - "src/cwr_worldgen/paved_junction_policy.py"
      - "src/cwr_worldgen/gravel_family_policy.py"
      - "tests/test_stock_road_surface_layering.py"
      - "tests/test_stock_gravel_paved_overlap.py"
      - "src/cwr_worldgen/final_road_dedup_policy.py"
      - ".github/workflows/stock-road-surface-layering.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-road-layer-order:
    name: Verify stock dirt-gravel-paved height order
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Assert dirt-gravel-paved surfaces and all junction heights
        run: |
          python -m pytest -q tests/test_stock_road_surface_layering.py tests/test_stock_gravel_paved_overlap.py
      - name: Check existing road finishing, synthetic junctions and stock models
        run: |
          python -m pytest -q tests/test_road_finish_parallel_policy.py tests/test_synthetic_paved_junctions.py tests/test_paved_junction_performance_policy.py tests/test_gravel_junction_policy.py
      - name: Regress final mixed-surface road clipping and retained dirt repairs
        run: |
          python -m pytest -q \
            tests/test_final_road_dedup_policy.py::test_short_paved_piece_trims_the_actual_stock_gravel_footprint \
            tests/test_final_road_dedup_policy.py::test_perpendicular_dirt_crossing_keeps_lowered_terminal_pieces \
            tests/test_final_road_dedup_policy.py::test_dirt_t_approach_finishes_with_piece_diving_under_paved \
            tests/test_final_road_dedup_policy.py::test_paved_junction_footprint_keeps_dirt_terminals_below_hub \
            tests/test_final_road_dedup_policy.py::test_unified_dirt_overlap_repairs_remain_generated_ribbons \
            tests/test_final_road_dedup_policy.py::test_dirt_under_high_paved_overpass_is_preserved \
            tests/test_final_road_dedup_policy.py::test_paved_surface_wins_over_coincident_dirt_piece
