name: Validate stock forest undergrowth textures

on:
  push:
    branches:
      - feature/optional-stock-forest-undergrowth-ground-20261021
  pull_request:
    paths:
      - "src/cwr_worldgen/terrain.py"
      - "src/cwr_worldgen/osm.py"
      - "src/cwr_worldgen/forest_ground_blends.py"
      - "src/cwr_worldgen/everon_water_blends.py"
      - "src/cwr_worldgen/stock_water_ground_blends.py"
      - "src/cwr_worldgen/nogova_water_blends.py"
      - "src/cwr_worldgen/nogova_terrain_clutter.py"
      - "src/cwr_worldgen/stock_terrain_clutter_profiles.py"
      - "src/cwr_worldgen/surface_pass.py"
      - "src/cwr_worldgen/generator.py"
      - "src/cwr_worldgen/milestone9.py"
      - "src/cwr_worldgen/gui.py"
      - "src/cwr_worldgen/cli.py"
      - "tests/test_forest_undergrowth_textures.py"
      - "tests/test_vegetation_sampling_limits.py"
      - "tests/test_everon_water_blends.py"
      - "tests/test_stock_water_ground_blends.py"
      - "tests/test_nogova_water_blends.py"
      - "tests/test_nogova_terrain_clutter.py"
      - "tests/test_stock_terrain_clutter.py"
      - "tests/test_milestone9.py"
      - ".github/workflows/forest-undergrowth-textures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Forest texture controls and surface mapping
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Check forest texture and GUI controls
        run: |
          python -m pytest -q tests/test_forest_undergrowth_textures.py
      - name: Verify Everon original-water shoreline textures and WRP output
        run: |
          python -m pytest -q tests/test_everon_water_blends.py
      - name: Verify stock Abel and Cain underwater-only textures and borders
        run: |
          python -m pytest -q tests/test_stock_water_ground_blends.py
      - name: Verify original Nogova ps-pt-t1 submerged shoreline borders
        run: |
          python -m pytest -q tests/test_nogova_water_blends.py
      - name: Validate measured Nogova small-clutter checkbox and placement
        run: |
          python -m pytest -q tests/test_nogova_terrain_clutter.py
      - name: Validate source-measured Eden Abel Cain clutter and tree-preset gating
        run: |
          python -m pytest -q tests/test_stock_terrain_clutter.py
      - name: Validate unbiased mapped trees and multiple safe forest-scatter candidates
        run: |
          python -m pytest -q tests/test_vegetation_sampling_limits.py
      - name: Malden and Kolgujev coast classification
        run: |
          python -m pytest -q tests/test_milestone9.py -k test_malden_kolgujev_remove_dry_beach_but_keep_water
      - name: Existing surface and runway regressions
        run: |
          python -m pytest -q tests/test_farmland_patch_pattern.py tests/test_runway_surface_policy.py
      - name: GUI regressions excluding pre-existing building-preset count mismatch
        run: |
          # Baseline test expects 25 regional presets even though current main has 24.
          # The forest-texture change does not alter building preset catalogues.
          python -m pytest -q tests/test_gui.py -k 'not test_building_preset_defaults_to_area_country_auto_detection'
