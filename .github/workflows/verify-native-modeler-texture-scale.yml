name: Verify native OSM House Modeler texture scale

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sources]" pytest

      - name: Run texture and building regressions
        run: |
          pytest -q \
            tests/test_osm_house_modeler_texture_bridge.py \
            tests/test_osm_house_modeler_geometry_fidelity.py \
            tests/test_osm_house_modeler_full_style.py \
            tests/test_house_style_catalogue.py \
            tests/test_osm_house_modeler_upgrade.py \
            tests/test_building_shape_extensions.py \
            tests/test_milestone8.py \
            tests/test_milestone9.py::SemanticFeatureTests

      - name: Verify representative native-size material scale
        run: |
          python - <<'PY'
          import base64, json
          from cwr_worldgen.osm_house_modeler_texture_bridge import _wall_material_image

          meta = {
              "texture_renderer_revision": 2,
              "window": {"width_m": 1.2, "height_m": 1.35, "sill_height_m": 0.85},
              "door": {"width_m": 0.95, "height_m": 2.05},
          }
          enc = base64.urlsafe_b64encode(json.dumps(meta, sort_keys=True, separators=(",", ":")).encode()).decode().rstrip("=")
          token = f"western_brick|brick~{enc}|red brick"
          image = _wall_material_image(token, 3, 128)
          assert image.size == (128, 128)
          x = 64
          pixels = [image.getpixel((x, y)) for y in range(128)]
          transitions = sum(a != b for a, b in zip(pixels, pixels[1:]))
          print(f"representative_vertical_transitions={transitions}")
          assert transitions >= 12
          PY

      - name: Remove temporary branch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-native-modeler-texture-scale.yml
          git commit -m "Remove native texture verification workflow"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
