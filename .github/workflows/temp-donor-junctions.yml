name: Temporary donor junction verification

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest matplotlib zstandard
      - name: Compile donor junction modules
        run: python -m compileall -q src/cwr_worldgen/procedural_infrastructure.py src/cwr_worldgen/playability.py src/cwr_worldgen/road_chain_parallel_policy.py src/cwr_worldgen/road_quality_policy.py src/cwr_worldgen/paved_junction_policy.py src/cwr_worldgen/gravel_family_policy.py src/cwr_worldgen/gravel_junction_policy.py src/cwr_worldgen/generator.py src/cwr_worldgen/road_finish_parallel_policy.py src/cwr_worldgen/road_inspector.py
      - name: Run donor road tests
        run: python -m pytest -q tests/test_modded_road_styles.py tests/test_road_inspector.py
