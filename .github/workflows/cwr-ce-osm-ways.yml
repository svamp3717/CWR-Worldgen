name: Validate CWR-CE native road ways

on:
  push:
    branches:
      - feature/cwr-ce-osm-road-ways
  pull_request:
    paths:
      - "src/cwr_worldgen/road_ways.py"
      - "src/cwr_worldgen/generator.py"
      - "src/cwr_worldgen/model.py"
      - "src/cwr_worldgen/gui.py"
      - "tests/test_gui.py"
      - "tests/test_road_ways.py"
      - ".github/workflows/cwr-ce-osm-ways.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-road-ways:
    name: Native road ways and rural smoothing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Check Python syntax
        run: python -m compileall -q src/cwr_worldgen/road_ways.py src/cwr_worldgen/generator.py src/cwr_worldgen/gui.py tests/test_road_ways.py tests/test_gui.py
      - name: Native road ways, PBO hygiene and rural curve regressions
        run: python -m pytest -q tests/test_road_ways.py
      - name: GUI profile persistence regressions
        run: |
          python -m pytest -q \
            tests/test_gui.py::GuiCommandTests::test_game_profile_is_remembered_and_restored \
            tests/test_gui.py::GuiCommandTests::test_game_profile_ignores_corrupt_or_obsolete_state
