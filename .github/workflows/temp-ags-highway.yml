name: Temporary AGS highway verification

on:
  push:
    branches:
      - feature/custom-road-generation

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e . pytest matplotlib zstandard
      - name: Compile changed road modules
        run: python -m compileall -q src/cwr_worldgen/legacy_proxy_models.py src/cwr_worldgen/playability.py src/cwr_worldgen/paved_junction_fallback_policy.py src/cwr_worldgen/procedural_infrastructure.py
      - name: Run focused mod-road tests
        run: python -m pytest -q tests/test_modded_road_styles.py
