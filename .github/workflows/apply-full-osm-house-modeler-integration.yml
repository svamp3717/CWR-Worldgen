name: Apply full OSM House Modeler integration

on:
  push:
    branches:
      - upgrade/osm-house-modeler-buildings

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/osm-house-modeler-buildings
          fetch-depth: 0

      - name: Apply full integration patch
        run: python tools/apply_full_osm_house_modeler_integration.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run modeler and building regressions
        run: |
          pytest -q \
            tests/test_osm_house_modeler_full_style.py \
            tests/test_house_style_catalogue.py \
            tests/test_osm_house_modeler_upgrade.py \
            tests/test_building_shape_extensions.py \
            tests/test_milestone8.py \
            tests/test_milestone9.py::SemanticFeatureTests

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-full-osm-house-modeler-integration.yml
          git add -A
          git commit -m "Integrate detailed OSM House Modeler architecture"
          git push origin HEAD:upgrade/osm-house-modeler-buildings
