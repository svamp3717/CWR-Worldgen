[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwr-worldgen"
dynamic = ["version"]
description = "Deterministic OFP/CWA-compatible RVW4 world generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "CWR-CE contributors" }]
dependencies = ["Pillow>=10", "Shapely>=2.0,<3"]

[project.optional-dependencies]
sources = ["dem-stitcher>=2.5,<3", "rasterio>=1.4", "numpy>=1.26", "overturemaps>=1.0,<2"]

[project.scripts]
cwr-worldgen = "cwr_worldgen.cli:main"

[project.gui-scripts]
cwr-worldgen-gui = "cwr_worldgen.gui_entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "cwr_worldgen._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cwr_worldgen" = ["data/eden_gravel/*.paa", "data/eden_gravel/*.txt", "data/gravel_reference.png"]
